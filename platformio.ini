; ==========================================================
; Waveshare ESP32-S3 + W5500 Ethernet Projekt
; mit AsyncWebServer_ESP32_SC_W5500 + WebSockets
; ==========================================================

[env:esp32-s3-eth]
platform      = espressif32@6.5.0
board         = esp32-s3-devkitc-1
framework     = arduino

build_src_filter =
    +<*>
    -<core_legacy/>

board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = direct
; Serial Monitor oeffnen ohne Auto-Reset ueber DTR/RTS.
; Wichtig fuer Kaltstart-/Reaktivitaetstests: Monitor darf das Board nicht
; durch Port-Oeffnen erneut starten.
monitor_rts = 0
monitor_dtr = 0

upload_speed = 115200

; ----------------------------------------------------------
; Libraries
; ----------------------------------------------------------
lib_deps = 
    ;khoih-prog/AsyncWebServer_ESP32_SC_W5500
    me-no-dev/AsyncTCP
    bblanchon/ArduinoJson @ ^7.0.4
    https://github.com/khoih-prog/AsyncWebServer_ESP32_SC_W5500
    https://github.com/khoih-prog/AsyncUDP_ESP32_SC_W5500
    ; adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SH110X

; ----------------------------------------------------------
; Build Flags für den ESP32-S3
; USB-CDC aktivieren (sonst keine serielle Ausgabe!)
; ----------------------------------------------------------
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

    ; Release-default: Library-internal logs AUS
    -D_ASYNC_WEBSERVER_LOGLEVEL_=0

    ; WLAN hart AUS (wie gewünscht)
    -DARDUINO_WIFI_DISABLED
    -DWIFI_DISABLED

    ; ---- EE Log Policy (Release defaults) ----
    ; Errors/Warn sind in debug.h default an, INFO/DEBUG default aus.
    ; (Hier im Release-env bewusst KEINE -DEE_LOG_ENABLE_* und KEINE -DEE_DEBUG_*.)
    ;
    ; Optional Debug-Flags (nur zum schnellen Einschalten – NICHT im Release nutzen):
    ; -DEE_LOG_ENABLE_INFO=1
    ; -DEE_LOG_ENABLE_DEBUG=1
    ; -DEE_DEBUG_WS=1
    ; -DEE_DEBUG_WSLAT=1
    ; -DEE_DEBUG_HEAP=1
    ; -DEE_DEBUG_I2C=1
    ; -DEE_DEBUG_DRDY=1
    ; -DEE_DEBUG_SAFETY=1
    ; -DEE_DEBUG_DIAG=1

; Falls du EXPLIZIT die W5500-Pins setzen willst (optional)
;  -DMOSI_GPIO=11
;  -DMISO_GPIO=12
;  -DSCK_GPIO=13
;  -DCS_GPIO=14
;  -DINT_GPIO=10
;  -DRST_GPIO=9

extra_scripts =
  pre:tools/bump_ui_version.py


; ==========================================================
; Simulation ohne Hardware (wie Mega2: eigenes Env mit Flags)
; - Aktiviert SIM-spezifische UI/WS-Features (z.B. SBHF Selftest-Step überspringen)
; ==========================================================
[env:esp32-s3-eth-sim]
extends = env:esp32-s3-eth
build_flags =
    ${env:esp32-s3-eth.build_flags}
    -DEE_SIM_NO_HW=1

    ; Debug-Framework aktivieren (aber Kategorien bleiben aus, bis du sie einschaltest)
    -DEE_LOG_ENABLE_DEBUG=1
    -DEE_LOG_ENABLE_INFO=1

    ; gezielt einschalten (optional):
    ; -DEE_DEBUG_WS=1
    ; -DEE_DEBUG_WSLAT=1
    ; -DEE_DEBUG_HEAP=1

; ------------------------------------------------------------
; Debug convenience envs (no manual flag editing needed)
; ------------------------------------------------------------

[env:esp32-s3-eth-debug-ws]
extends = env:esp32-s3-eth
build_type = debug
build_flags =
  ${env:esp32-s3-eth.build_flags}
  -DEE_LOG_ENABLE_INFO=1
  -DEE_LOG_ENABLE_DEBUG=1
  -DEE_DEBUG_WS=1

[env:esp32-s3-eth-debug-wslat]
extends = env:esp32-s3-eth
build_type = debug
build_flags =
  ${env:esp32-s3-eth.build_flags}
  -DEE_LOG_ENABLE_INFO=1
  -DEE_LOG_ENABLE_DEBUG=1
  -DEE_DEBUG_WSLAT=1

[env:esp32-s3-eth-debug-i2c]
extends = env:esp32-s3-eth
build_type = debug
build_flags =
  ${env:esp32-s3-eth.build_flags}
  -DEE_LOG_ENABLE_INFO=1
  -DEE_LOG_ENABLE_DEBUG=1
  -DEE_DEBUG_I2C=1

[env:esp32-s3-eth-debug-heap]
extends = env:esp32-s3-eth
build_type = debug
build_flags =
  ${env:esp32-s3-eth.build_flags}
  -DEE_LOG_ENABLE_INFO=1
  -DEE_LOG_ENABLE_DEBUG=1
  -DEE_DEBUG_HEAP=1

[env:esp32-s3-eth-debug-ws-wslat]
extends = env:esp32-s3-eth
build_type = debug
build_flags =
  ${env:esp32-s3-eth.build_flags}
  -DEE_LOG_ENABLE_INFO=1
  -DEE_LOG_ENABLE_DEBUG=1
  -DEE_DEBUG_WS=1
  -DEE_DEBUG_WSLAT=1


; ------------------------------------------------------------
; Minimal E2E write-path tracing (WS → Queue → I2C → Mega2)
; Only enables the dedicated DIAGW one-line logs added in this chat.
; Keep all other EE_DEBUG_* categories OFF.
; ------------------------------------------------------------
[env:esp32-s3-eth-debug-diagwrite]
extends = env:esp32-s3-eth
build_type = debug
; ensure PIO offers "Upload Filesystem Image" for this env
board_build.filesystem = littlefs
build_flags =
  ${env:esp32-s3-eth.build_flags}
  ; allow EE_LOGI("DIAGW", ...) to be printed
  -DEE_LOG_ENABLE_INFO=1
  ; enable only the dedicated write-path logs
  -DEE_DEBUG_DIAG_WRITE=1


; ------------------------------------------------------------
; Focused HMI push tracing
; For debugging ETH -> HMI state delivery:
; - HmiPush::loop() decisions (dirty/full/hash/send)
; - HMI UART sendJson() rate-limit / send attempts
; Keep all other EE_DEBUG_* categories OFF.
; ------------------------------------------------------------
[env:esp32-s3-eth-hmipushdebug]
extends = env:esp32-s3-eth
build_type = debug
board_build.filesystem = littlefs
build_flags =
  ${env:esp32-s3-eth.build_flags}
  ; allow EE_LOGI("HMIPUSH", ...) / EE_LOGI("HMIUART", ...)
  -DEE_LOG_ENABLE_INFO=1
; ------------------------------------------------------------
; ETH reactivity tracing (measurement only)
; Measures main-loop timing, WebSocket action handling and HMI push enqueue timing.
; Intended for cold-start / long-runtime responsiveness tests.
; ------------------------------------------------------------
[env:esp32-s3-eth-reactivity]
extends = env:esp32-s3-eth
build_type = debug
board_build.filesystem = littlefs
build_flags =
  ${env:esp32-s3-eth.build_flags}
  -DEE_DEBUG_REACT=1
  -DEE_DEBUG_HTTP=1
  -DEE_DEBUG_WSLAT=1
  -DEE_DEBUG_HMILAT=1
  ; Serial-Guard ist in include/debug.h global default aktiv.
  ; Optionaler Phase-2-Test: state-lite Periodic von 1s auf 2.5s setzen.
  ; Zum Aktivieren Semikolon entfernen.
  ;-DREACT_SLOW_STATELITE=1
