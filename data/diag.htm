<body>
  <main class="container">
    <h1>Diagnose</h1>

    <div class="status-box" id="diag-status">WS: …</div>

    <div style="display:flex; gap:.5rem; flex-wrap:wrap; margin:.75rem 0;">
      <button class="btn" id="diag-enter">Diagnose starten – andere UIs sperren</button>
      <button class="btn" id="diag-exit" disabled>Diagnose beenden – Sperre aufheben</button>
      <a class="btn" href="index.htm">Zur Hauptseite</a>
    </div>

    <hr>
    <p><strong>Hinweis:</strong> Solange Diagnose aktiv ist, sind Schreibaktionen für andere Clients gesperrt.</p>

    <h2 style="margin-top:1rem;">Diag-Stream</h2>
    <pre id="diag-json" style="white-space:pre-wrap; font-size:.9rem; background:rgba(0,0,0,0.04); padding:.75rem; border-radius:10px; max-height:55vh; overflow:auto;">(warte auf type:"diag" ...)</pre>
  </main>

  <script src="diag.js"></script>
